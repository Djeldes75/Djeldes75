name: Update career bar

on:
  push:
    paths: [career.json, scripts/career.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/career.js
      - name: Save the new bar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/career.svg
          git diff --cached --quiet || (git commit -m "Career progress: $(node -p 'require(\"./career.json\").progress')%" && git push)
